[project]
name = "matchday-copilot"
version = "1.0.0"
description = "GenAI-powered smart stadium & tournament operations assistant for FIFA World Cup 2026"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
